[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-workbench"
version = "0.1.0"
description = "AGI Workbench CLI"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyyaml"]

[tool.setuptools]
package-dir = {"" = "src", "app" = "app"}
packages = ["agiwb", "agiwb.reflection", "agiwb.rules", "agiwb.ledger", "app"]
